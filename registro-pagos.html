<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Pagos - The Crown</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 15px; background-color: #25D366; color: white; border: none; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
    button:hover { background-color: #1DA851; }
  </style>
</head>
<body>

  <h2>Registro de Pagos 📋</h2>
  
  <form id="formularioPago">
    <label for="ticket">Número de Ticket:</label>
    <input type="text" id="ticket" name="ticket" placeholder="Ej. T-001" required>

    <label for="cobrador">¿Quién está cobrando?</label>
    <select id="cobrador" name="cobrador" required>
      <option value="" disabled selected>Selecciona tu nombre...</option>
      <option value="Paula Alarcón">Paula Alarcón</option>
      <option value="Dulce">Dulce</option>
      <option value="David">David</option>
      <option value="Paulina Hernández">Paulina Hernández</option>
      <option value="Daniel Urquijo">Daniel Urquijo</option>
    </select>

    <label for="alumno">Nombre del Alumno:</label>
    <input type="text" id="alumno" name="alumno" required>

    <label for="telefono">Teléfono del Alumno (10 dígitos):</label>
    <input type="tel" id="telefono" name="telefono" placeholder="Ej. 4421234567" required>

    <label for="concepto">Concepto de Pago:</label>
    <select id="concepto" name="concepto" onchange="mostrarPersonalizado()" required>
      <option value="Mensualidad">Mensualidad</option>
      <option value="Inscripción">Inscripción</option>
      <option value="Ensayo Extra">Ensayo Extra</option>
      <option value="Competencia">Competencia</option>
      <option value="Otro">Otro</option>
    </select>

    <div id="divPersonalizado" style="display:none;">
      <label for="conceptoPersonalizado">Especificar Concepto:</label>
      <input type="text" id="conceptoPersonalizado" name="conceptoPersonalizado">
    </div>

    <label for="monto">Monto ($):</label>
    <input type="number" id="monto" name="monto" required>

    <label for="notas">Notas (Opcional):</label>
    <textarea id="notas" name="notas" rows="3"></textarea>

    <button type="submit">Registrar y Enviar WhatsApp 📲</button>
  </form>

  <script>
    // URL de tu Google Apps Script (¡Cámbiala por la tuya!)
    const SCRIPT_URL = "TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI";

    function mostrarPersonalizado() {
      const concepto = document.getElementById("concepto").value;
      const divPer = document.getElementById("divPersonalizado");
      divPer.style.display = (concepto === "Otro") ? "block" : "none";
    }

    document.getElementById("formularioPago").addEventListener("submit", function(e) {
      e.preventDefault(); // Evita que la página se recargue

      // 1. Recopilar los datos del formulario
      const formData = new FormData(this);
      let conceptoFinal = formData.get("concepto");
      if (conceptoFinal === "Otro") {
        conceptoFinal = formData.get("conceptoPersonalizado");
        formData.set("concepto", conceptoFinal); // Sobrescribir para mandar al script
      }

      // 2. Enviar datos a Google Sheets (en segundo plano)
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: formData
      }).then(() => {
        console.log("Datos enviados a Google Sheets");
      }).catch(error => {
        console.error("Error al enviar a Sheets:", error);
      });

      // 3. Crear el mensaje de WhatsApp
      const telefono = formData.get("telefono");
      const alumno = formData.get("alumno");
      const ticket = formData.get("ticket");
      const monto = formData.get("monto");
      const cobrador = formData.get("cobrador");

      const mensaje = `¡Hola, ${alumno}! 👑\n\nConfirmamos la recepción de tu pago.\n\n🎟️ *Ticket:* ${ticket}\n💰 *Monto:* $${monto}\n📝 *Concepto:* ${conceptoFinal}\n👤 *Atendido por:* ${cobrador}\n\n¡Gracias por ser parte de la academia!`;

      // 4. Abrir WhatsApp para enviar el mensaje
      const whatsappUrl = `https://wa.me/52${telefono}?text=${encodeURIComponent(mensaje)}`;
      window.open(whatsappUrl, "_blank");

      // Opcional: Limpiar el formulario después de enviar
      this.reset();
      document.getElementById("divPersonalizado").style.display = "none";
    });
  </script>

</body>
</html>

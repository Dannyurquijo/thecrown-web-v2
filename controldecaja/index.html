<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financiero | The Crown</title>
    
    <!-- Fuentes de The Crown -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">
    
    <!-- Librería de Gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --fondo: #000000;
            --superficie: rgba(20, 20, 20, 0.6);
            --borde: rgba(255, 255, 255, 0.1);
            --rosa-neon: #FF66C4;
            --dorado: #C19A51;
            --texto-principal: #ffffff;
            --texto-secundario: #a1a1a6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--fondo);
            color: var(--texto-principal);
            font-family: 'Glacial Indifference', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Brillos ambientales */
        body::before {
            content: ''; position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(255, 102, 196, 0.15) 0%, transparent 70%);
            z-index: -1; filter: blur(80px);
        }
        body::after {
            content: ''; position: fixed; bottom: -10%; right: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(193, 154, 81, 0.15) 0%, transparent 70%);
            z-index: -1; filter: blur(80px);
        }

        h1, h2, h3 { font-family: 'League Spartan', sans-serif; text-transform: uppercase; }

        /* Contenedores Glassmorphism */
        .glass-card {
            background: var(--superficie);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--borde);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* Pantallas de Login */
        .login-container {
            display: flex; justify-content: center; align-items: center; 
            min-height: 80vh; width: 100%;
        }
        .login-box { max-width: 400px; text-align: center; }
        .login-box h1 { color: var(--dorado); margin-bottom: 10px; font-size: 2.5rem; }
        
        .pin-input {
            background: rgba(0,0,0,0.5); border: 2px solid var(--borde);
            color: white; font-size: 2rem; text-align: center; letter-spacing: 15px;
            padding: 15px; border-radius: 12px; width: 100%; margin-bottom: 20px;
            font-family: 'League Spartan', sans-serif;
        }
        .pin-input:focus { outline: none; border-color: var(--rosa-neon); }

        /* Estructura Principal */
        #main-content { display: none; width: 100%; max-width: 1200px; }
        
        .forms-grid {
            display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 30px;
        }
        @media (min-width: 768px) { .forms-grid { grid-template-columns: 1fr 1fr; } }

        /* Elementos de Formulario */
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-family: 'League Spartan'; font-size: 0.85rem; color: var(--texto-secundario); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        input, select {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--borde);
            border-radius: 10px; padding: 12px; color: white;
            font-family: 'Glacial Indifference'; font-size: 1rem;
        }
        input:focus, select:focus { outline: none; border-color: var(--dorado); }
        select option { background-color: #0A0A0A; color: #FFFFFF; font-family: 'Glacial Indifference', sans-serif; }

        /* Botones */
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            font-family: 'League Spartan'; font-weight: 700; font-size: 1.1rem;
            text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-rosa { background: var(--rosa-neon); color: black; }
        .btn-rosa:hover { box-shadow: 0 0 20px rgba(255,102,196,0.4); transform: translateY(-2px); }
        .btn-dorado { background: var(--dorado); color: black; }
        .btn-dorado:hover { box-shadow: 0 0 20px rgba(193,154,81,0.4); transform: translateY(-2px); }
        .btn-outline { background: transparent; color: white; border: 2px solid var(--texto-secundario); margin-bottom: 20px; }
        .btn-outline:hover { border-color: white; }

        .btn-filtro { padding: 8px 15px; font-size: 0.9rem; margin-top: 0; width: auto; opacity: 0.6; }
        .btn-filtro.activo { opacity: 1; box-shadow: 0 0 15px rgba(255,255,255,0.2); }

        .alert { margin-top: 15px; font-size: 0.9rem; display: none; text-align: center; }

        /* Modal y Gráficas */
        #modal-graficas {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        #seccion-graficas { display: none; margin-top: 20px; text-align: center; }
        .chart-container { position: relative; height: 300px; width: 100%; margin-top: 20px; }
        @media (min-width: 768px) { .chart-container { height: 400px; } }
        
        #loading-datos { color: var(--rosa-neon); margin-top: 20px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <!-- CAPA 1: PANTALLA DE BLOQUEO (Recepción) -->
    <div id="login-screen" class="login-container">
        <div class="glass-card login-box">
            <h1>THE CROWN</h1>
            <p style="color: var(--texto-secundario); margin-bottom: 30px;">Control Financiero Interno</p>
            <input type="password" id="pin-input-1" class="pin-input" maxlength="4" placeholder="••••">
            <button class="btn btn-dorado" onclick="verificarPIN1()">Desbloquear</button>
            <p id="error-pin-1" class="alert" style="color: #ff4444;">PIN incorrecto</p>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="main-content">
        <button class="btn btn-outline" onclick="abrirModalGraficas()">📊 Ver Balance y Gráficas (Requiere Autorización)</button>

        <div class="forms-grid">
            <!-- Arqueo de Caja -->
            <div class="glass-card">
                <h2 style="color: var(--rosa-neon); margin-bottom: 25px; text-align: center;">Corte de Caja Diario</h2>
                <form id="formCorte" onsubmit="enviarCorte(event)">
                    <div class="form-group">
                        <label>Fondo Inicial ($)</label>
                        <input type="number" id="fondoInicial" required oninput="calcularNeto()">
                    </div>
                    <div class="form-group">
                        <label>Corte Final ($)</label>
                        <input type="number" id="corteFinal" required oninput="calcularNeto()">
                    </div>
                    <div class="form-group">
                        <label>Ingreso Neto ($)</label>
                        <input type="number" id="ingresoNeto" readonly style="background: rgba(255,102,196,0.1); color: var(--rosa-neon); font-weight: bold;">
                    </div>
                    <div class="form-group">
                        <label>Responsable</label>
                        <input type="text" id="respCorte" required placeholder="Nombre de recepción">
                    </div>
                    <button type="submit" class="btn btn-rosa" id="btnCorte">Guardar Corte</button>
                    <p id="msgCorte" class="alert" style="color: #4CAF50;">¡Corte registrado!</p>
                </form>
            </div>

            <!-- Registro de Egresos -->
            <div class="glass-card">
                <h2 style="color: var(--dorado); margin-bottom: 25px; text-align: center;">Registro de Egresos</h2>
                <form id="formEgreso" onsubmit="enviarEgreso(event)">
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="categoriaEgreso" required>
                            <option value="" disabled selected>Selecciona un rubro</option>
                            <option value="Nomina">Nómina / Maestros</option>
                            <option value="Limpieza">Limpieza</option>
                            <option value="Servicios">Servicios (Luz, Agua, Internet)</option>
                            <option value="Renta">Renta</option>
                            <option value="Otros">Otros (Especificar)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Monto ($)</label>
                        <input type="number" id="montoEgreso" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <input type="text" id="descEgreso" required placeholder="Ej. Focos, quincena, etc.">
                    </div>
                    <div class="form-group">
                        <label>Responsable</label>
                        <input type="text" id="respEgreso" required placeholder="Tu nombre">
                    </div>
                    <button type="submit" class="btn btn-dorado" id="btnEgreso">Registrar Egreso</button>
                    <p id="msgEgreso" class="alert" style="color: #4CAF50;">¡Egreso registrado!</p>
                </form>
            </div>
        </div>

        <!-- SECCIÓN DE GRÁFICAS -->
        <div id="seccion-graficas" class="glass-card">
            <h2 style="color: white; margin-bottom: 5px;">Balance Financiero</h2>
            <p id="loading-datos">Conectando con la base de datos...</p>
            
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap;" id="controles-grafica" style="display: none;">
                <button id="btn-diario" class="btn btn-rosa btn-filtro" onclick="procesarYDibujar('diario')">Diario (Hoy)</button>
                <button id="btn-semanal" class="btn btn-dorado btn-filtro activo" onclick="procesarYDibujar('semanal')">Últimos 7 días</button>
                <button id="btn-mensual" class="btn btn-outline btn-filtro" style="margin-bottom:0;" onclick="procesarYDibujar('mensual')">Mes Actual</button>
            </div>
            
            <div class="chart-container">
                <canvas id="miGrafica"></canvas>
            </div>
        </div>
    </div>

    <!-- CAPA 2: MODAL PARA PIN MAESTRO -->
    <div id="modal-graficas">
        <div class="glass-card login-box">
            <h2 style="color: var(--rosa-neon); margin-bottom: 15px;">Acceso Directivo</h2>
            <p style="color: var(--texto-secundario); margin-bottom: 20px;">Ingresa el PIN maestro para ver gráficas.</p>
            <input type="password" id="pin-input-2" class="pin-input" maxlength="4" placeholder="••••">
            <button class="btn btn-rosa" onclick="verificarPIN2()">Descargar Datos</button>
            <button class="btn btn-outline" style="margin-top:10px; padding: 10px;" onclick="cerrarModalGraficas()">Cancelar</button>
            <p id="error-pin-2" class="alert" style="color: #ff4444;">PIN incorrecto</p>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN VITAL
        // ==========================================
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzCqyq555AUPc4jm6RS05eG6eqa1cM9K_jSH4NtNANvyiUjIU2FBrOz8NYLQDbffREs8g/exec'; // <--- ¡PEGA TU URL AQUÍ!

        // ==========================================
        // 2. SEGURIDAD Y PANTALLAS
        // ==========================================
        function verificarPIN1() {
            if (document.getElementById('pin-input-1').value === '1234') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                document.getElementById('error-pin-1').style.display = 'block';
                setTimeout(() => document.getElementById('error-pin-1').style.display = 'none', 3000);
            }
        }

        function abrirModalGraficas() { document.getElementById('modal-graficas').style.display = 'flex'; }
        function cerrarModalGraficas() { 
            document.getElementById('modal-graficas').style.display = 'none';
            document.getElementById('pin-input-2').value = '';
        }

        function verificarPIN2() {
            if (document.getElementById('pin-input-2').value === '4321') {
                cerrarModalGraficas();
                document.getElementById('seccion-graficas').style.display = 'block';
                document.getElementById('seccion-graficas').scrollIntoView({ behavior: 'smooth' });
                
                // Si aún no hay datos, descargarlos de Google Sheets
                if (!datosCrudos) {
                    descargarDatos();
                }
            } else {
                document.getElementById('error-pin-2').style.display = 'block';
                setTimeout(() => document.getElementById('error-pin-2').style.display = 'none', 3000);
            }
        }

        // ==========================================
        // 3. ENVÍO DE DATOS A GOOGLE SHEETS
        // ==========================================
        function calcularNeto() {
            const inicial = parseFloat(document.getElementById('fondoInicial').value) || 0;
            const final = parseFloat(document.getElementById('corteFinal').value) || 0;
            document.getElementById('ingresoNeto').value = (final - inicial).toFixed(2);
        }

        function peticionPost(datos, btnId, msgId, formId, txtOriginal) {
            const btn = document.getElementById(btnId);
            btn.innerText = 'Guardando...'; btn.disabled = true;

            fetch(scriptURL, {
                method: 'POST', body: JSON.stringify(datos),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(() => {
                document.getElementById(msgId).style.display = 'block';
                document.getElementById(formId).reset();
                setTimeout(() => document.getElementById(msgId).style.display = 'none', 3000);
                
                // Si la gráfica ya estaba abierta, forzar recarga silenciosa de datos
                if(datosCrudos) descargarDatos(true); 
            })
            .catch(err => alert('Error: ' + err.message))
            .finally(() => { btn.innerText = txtOriginal; btn.disabled = false; });
        }

        function enviarCorte(e) {
            e.preventDefault();
            peticionPost({
                tipo: "corte",
                fondoInicial: document.getElementById('fondoInicial').value,
                corteFinal: document.getElementById('corteFinal').value,
                ingresoNeto: document.getElementById('ingresoNeto').value,
                responsable: document.getElementById('respCorte').value
            }, 'btnCorte', 'msgCorte', 'formCorte', 'Guardar Corte');
        }

        function enviarEgreso(e) {
            e.preventDefault();
            peticionPost({
                tipo: "egreso",
                categoria: document.getElementById('categoriaEgreso').value,
                monto: document.getElementById('montoEgreso').value,
                descripcion: document.getElementById('descEgreso').value,
                responsable: document.getElementById('respEgreso').value
            }, 'btnEgreso', 'msgEgreso', 'formEgreso', 'Registrar Egreso');
        }

        // ==========================================
        // 4. LÓGICA DE GRÁFICAS Y MOTOR MATEMÁTICO
        // ==========================================
        let graficaFinanciera;
        let datosCrudos = null; // Aquí vivirá la base de datos descargada

        // Descarga inicial desde Apps Script
        function descargarDatos(silencioso = false) {
            if(!silencioso) document.getElementById('loading-datos').style.display = 'block';
            
            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    datosCrudos = data;
                    if(!silencioso) {
                        document.getElementById('loading-datos').style.display = 'none';
                        inicializarGraficaVacia();
                    }
                    procesarYDibujar('semanal'); // Vista por defecto
                })
                .catch(err => {
                    document.getElementById('loading-datos').innerText = "Error de conexión. Intenta recargar.";
                    console.error(err);
                });
        }

        // Crear la estructura visual vacía de Chart.js
        function inicializarGraficaVacia() {
            if (graficaFinanciera) graficaFinanciera.destroy();
            const ctx = document.getElementById('miGrafica').getContext('2d');
            Chart.defaults.color = '#a1a1a6';
            Chart.defaults.font.family = "'Glacial Indifference', sans-serif";

            graficaFinanciera = new Chart(ctx, {
                type: 'bar',
                data: { labels: [], datasets: [
                    { label: 'Ingresos Netos', data: [], backgroundColor: '#FF66C4', borderRadius: 5 },
                    { label: 'Egresos', data: [], backgroundColor: '#C19A51', borderRadius: 5 }
                ]},
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: {
                        y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, beginAtZero: true },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        // Filtrar y Matemáticas
        function procesarYDibujar(filtro) {
            if (!datosCrudos) return;

            // Actualizar estilo de botones
            document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('activo'));
            document.getElementById('btn-' + filtro).classList.add('activo');

            const hoy = new Date();
            hoy.setHours(0,0,0,0);
            
            let fechaLimite = new Date();
            let esMensual = false;

            if (filtro === 'diario') {
                fechaLimite.setDate(hoy.getDate()); // Solo de hoy
            } else if (filtro === 'semanal') {
                fechaLimite.setDate(hoy.getDate() - 6); // Hace 7 días
            } else if (filtro === 'mensual') {
                fechaLimite.setDate(1); // Desde el día 1 del mes actual
                esMensual = true;
            }

            let reporteAgrupado = {};

            // Función interna para organizar ingresos y egresos
            const agruparFila = (filaFechaStr, montoStr, tipo) => {
                let fechaRegistro = new Date(filaFechaStr);
                fechaRegistro.setHours(0,0,0,0);
                
                // Solo procesar si entra en el rango de tiempo
                if (fechaRegistro >= fechaLimite) {
                    let monto = parseFloat(montoStr) || 0;
                    
                    // Crear la etiqueta (ej. "15/09")
                    let etiqueta = fechaRegistro.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit' });
                    
                    if (!reporteAgrupado[etiqueta]) {
                        reporteAgrupado[etiqueta] = { ingresos: 0, egresos: 0, ms: fechaRegistro.getTime() };
                    }
                    reporteAgrupado[etiqueta][tipo] += monto;
                }
            };

            // Recorrer los datos crudos (Cortes Columna 3 es Ingreso Neto, Egresos Columna 2 es Monto)
            if (datosCrudos.cortes) datosCrudos.cortes.forEach(fila => agruparFila(fila[0], fila[3], 'ingresos'));
            if (datosCrudos.egresos) datosCrudos.egresos.forEach(fila => agruparFila(fila[0], fila[2], 'egresos'));

            // Extraer las fechas ordenadas
            let etiquetasOrdenadas = Object.keys(reporteAgrupado).sort((a, b) => reporteAgrupado[a].ms - reporteAgrupado[b].ms);
            
            // Si es vista diaria y no hay datos, forzar que salga "Hoy" en ceros
            if (filtro === 'diario' && etiquetasOrdenadas.length === 0) {
                let etiquetaHoy = hoy.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit' });
                etiquetasOrdenadas = [etiquetaHoy];
                reporteAgrupado[etiquetaHoy] = { ingresos: 0, egresos: 0 };
            }

            let datosIngresos = etiquetasOrdenadas.map(etiqueta => reporteAgrupado[etiqueta].ingresos);
            let datosEgresos = etiquetasOrdenadas.map(etiqueta => reporteAgrupado[etiqueta].egresos);

            // Inyectar en la gráfica y actualizar
            graficaFinanciera.data.labels = etiquetasOrdenadas;
            graficaFinanciera.data.datasets[0].data = datosIngresos;
            graficaFinanciera.data.datasets[1].data = datosEgresos;
            graficaFinanciera.update();
        }
    </script>
</body>
</html>

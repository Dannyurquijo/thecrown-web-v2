<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financiero | The Crown</title>
    
    <!-- Fuentes de The Crown -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">
    
    <!-- Librerías -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --fondo: #050505;
            --superficie: rgba(20, 20, 25, 0.65);
            --borde: rgba(255, 255, 255, 0.08);
            --rosa-neon: #FF66C4;
            --dorado: #C19A51;
            --texto-principal: #ffffff;
            --texto-secundario: #a1a1a6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--fondo); color: var(--texto-principal);
            font-family: 'Glacial Indifference', sans-serif; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; padding: 20px; position: relative;
        }

        /* Animaciones Dinámicas de Fondo */
        .blob {
            position: fixed; border-radius: 50%; filter: blur(90px); z-index: -1;
            animation: flotar 15s infinite alternate ease-in-out;
        }
        .blob.rosa {
            top: -10%; left: -10%; width: 45vw; height: 45vw;
            background: rgba(255, 102, 196, 0.25);
        }
        .blob.dorado {
            bottom: -10%; right: -10%; width: 50vw; height: 50vw;
            background: rgba(193, 154, 81, 0.2); animation-delay: -5s;
        }

        @keyframes flotar {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 5%) scale(1.1); }
            100% { transform: translate(-5%, -5%) scale(0.95); }
        }

        h1, h2, h3 { font-family: 'League Spartan', sans-serif; text-transform: uppercase; letter-spacing: 1px; }

        /* Contenedores Glassmorphism Animados */
        .glass-card {
            background: var(--superficie); backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px); border: 1px solid var(--borde);
            border-radius: 24px; padding: 30px; width: 100%; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px); box-shadow: 0 20px 45px rgba(0,0,0,0.7);
        }

        /* Pantallas de Login */
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 80vh; width: 100%; }
        .login-box { max-width: 400px; text-align: center; }
        .login-box h1 { 
            background: linear-gradient(90deg, var(--rosa-neon), var(--dorado));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px; font-size: 3rem; font-weight: 900;
        }
        
        .pin-input {
            background: rgba(0,0,0,0.6); border: 2px solid var(--borde); color: white;
            font-size: 2rem; text-align: center; letter-spacing: 15px; padding: 15px;
            border-radius: 12px; width: 100%; margin-bottom: 20px; font-family: 'League Spartan', sans-serif;
            transition: 0.3s;
        }
        .pin-input:focus { outline: none; border-color: var(--rosa-neon); box-shadow: 0 0 15px rgba(255,102,196,0.3); }

        #main-content { display: none; width: 100%; max-width: 1200px; animation: fadeIn 0.8s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .forms-grid { display: grid; grid-template-columns: 1fr; gap: 25px; margin-bottom: 30px; }
        @media (min-width: 768px) { .forms-grid { grid-template-columns: 1fr 1fr; } }

        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-family: 'League Spartan'; font-size: 0.85rem; color: var(--texto-secundario); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        input, select {
            width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--borde);
            border-radius: 12px; padding: 14px; color: white; font-family: 'Glacial Indifference'; font-size: 1.05rem;
            transition: 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: var(--dorado); background: rgba(255,255,255,0.08); }
        select option { background-color: #0A0A0A; color: #FFFFFF; font-family: 'Glacial Indifference', sans-serif; }

        /* Botones Vibrantes */
        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            font-family: 'League Spartan'; font-weight: 700; font-size: 1.1rem;
            text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; margin-top: 10px;
            letter-spacing: 1px;
        }
        .btn-rosa { background: linear-gradient(135deg, #FF66C4, #ff33a1); color: white; box-shadow: 0 4px 15px rgba(255,102,196,0.3); }
        .btn-rosa:hover { box-shadow: 0 8px 25px rgba(255,102,196,0.6); transform: translateY(-3px); }
        .btn-dorado { background: linear-gradient(135deg, #C19A51, #e3ba6b); color: #111; box-shadow: 0 4px 15px rgba(193,154,81,0.3); }
        .btn-dorado:hover { box-shadow: 0 8px 25px rgba(193,154,81,0.6); transform: translateY(-3px); }
        
        .btn-outline { background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--borde); margin-bottom: 20px; backdrop-filter: blur(10px); }
        .btn-outline:hover { border-color: var(--dorado); color: var(--dorado); background: rgba(193,154,81,0.1); }
        
        .btn-pdf { background: #ffffff; color: #000; margin-top: 20px; max-width: 300px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;}
        .btn-pdf:hover { background: #e0e0e0; transform: scale(1.02); }

        .btn-filtro { padding: 8px 20px; font-size: 0.95rem; margin-top: 0; width: auto; opacity: 0.4; border-radius: 30px; }
        .btn-filtro.activo { opacity: 1; transform: scale(1.05); }

        .alert { margin-top: 15px; font-size: 0.95rem; display: none; text-align: center; font-weight: bold; }

        /* Modal */
        #modal-graficas {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
            justify-content: center; align-items: center; z-index: 1000; padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        
        #seccion-graficas { display: none; margin-top: 20px; text-align: center; border: 2px solid rgba(193,154,81,0.2); }
        .chart-container { position: relative; height: 350px; width: 100%; margin-top: 20px; padding: 10px;}
        @media (min-width: 768px) { .chart-container { height: 450px; } }
        #loading-datos { color: var(--rosa-neon); margin-top: 20px; font-weight: bold; font-size: 1.2rem; display: none; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* Contenedor que será exportado a PDF */
        #reporte-exportar { padding: 20px; background: transparent; border-radius: 20px; }
    </style>
</head>
<body>

    <!-- Orbes animadas de fondo -->
    <div class="blob rosa"></div>
    <div class="blob dorado"></div>

    <!-- CAPA 1: RECEPCIÓN -->
    <div id="login-screen" class="login-container">
        <div class="glass-card login-box">
            <h1>THE CROWN</h1>
            <p style="color: var(--texto-secundario); margin-bottom: 30px; letter-spacing: 2px; text-transform: uppercase; font-size: 0.9rem;">Control Financiero</p>
            <input type="password" id="pin-input-1" class="pin-input" maxlength="4" placeholder="••••">
            <button class="btn btn-dorado" onclick="verificarPIN1()">Ingresar</button>
            <p id="error-pin-1" class="alert" style="color: #ff4444;">PIN incorrecto</p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-content">
        <button class="btn btn-outline" onclick="abrirModalGraficas()">📊 Analíticas y Reportes</button>

        <div class="forms-grid">
            <!-- CORTE DIARIO -->
            <div class="glass-card">
                <h2 style="color: var(--rosa-neon); margin-bottom: 25px; text-align: center;">Corte Diario</h2>
                <form id="formCorte" onsubmit="enviarCorte(event)">
                    <div class="form-group">
                        <label>Fondo Inicial ($)</label>
                        <input type="number" id="fondoInicial" required oninput="calcularNeto()">
                    </div>
                    <div class="form-group">
                        <label>Corte Final ($)</label>
                        <input type="number" id="corteFinal" required oninput="calcularNeto()">
                    </div>
                    <div class="form-group">
                        <label>Ingreso Neto ($)</label>
                        <input type="number" id="ingresoNeto" readonly style="background: rgba(255,102,196,0.1); color: var(--rosa-neon); font-weight: bold; border-color: rgba(255,102,196,0.3);">
                    </div>
                    <div class="form-group">
                        <label>Responsable</label>
                        <select id="respCorte" required>
                            <option value="" disabled selected>Sincronizando equipo...</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-rosa" id="btnCorte">Guardar Corte</button>
                    <p id="msgCorte" class="alert" style="color: #FF66C4;">¡Corte registrado con éxito! ✨</p>
                </form>
            </div>

            <!-- EGRESOS -->
            <div class="glass-card">
                <h2 style="color: var(--dorado); margin-bottom: 25px; text-align: center;">Egresos</h2>
                <form id="formEgreso" onsubmit="enviarEgreso(event)">
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="categoriaEgreso" required>
                            <option value="" disabled selected>Selecciona un rubro</option>
                            <option value="Nomina">Nómina / Maestros</option>
                            <option value="Limpieza">Limpieza</option>
                            <option value="Servicios">Servicios (Luz, Agua, Internet)</option>
                            <option value="Renta">Renta</option>
                            <option value="Otros">Otros (Especificar)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Monto ($)</label>
                        <input type="number" id="montoEgreso" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <input type="text" id="descEgreso" required placeholder="Ej. Focos, pagos...">
                    </div>
                    <div class="form-group">
                        <label>Responsable</label>
                        <select id="respEgreso" required>
                            <option value="" disabled selected>Sincronizando equipo...</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-dorado" id="btnEgreso">Registrar Egreso</button>
                    <p id="msgEgreso" class="alert" style="color: #C19A51;">¡Egreso descontado! ✔️</p>
                </form>
            </div>
        </div>

        <!-- SECCIÓN DE GRÁFICAS -->
        <div id="seccion-graficas" class="glass-card">
            
            <div id="reporte-exportar">
                <h2 style="color: white; margin-bottom: 5px;">Balance Financiero</h2>
                <p id="loading-datos">Extrayendo datos de la nube...</p>
                
                <div style="display: flex; gap: 15px; justify-content: center; margin-top: 15px; flex-wrap: wrap;" id="controles-grafica" style="display: none;">
                    <button id="btn-diario" class="btn btn-rosa btn-filtro" onclick="procesarYDibujar('diario')">Hoy</button>
                    <button id="btn-semanal" class="btn btn-dorado btn-filtro activo" onclick="procesarYDibujar('semanal')">7 Días</button>
                    <button id="btn-mensual" class="btn btn-outline btn-filtro" style="margin-bottom:0;" onclick="procesarYDibujar('mensual')">Mes</button>
                </div>
                
                <div class="chart-container">
                    <canvas id="miGrafica"></canvas>
                </div>
            </div>
            
            <!-- Botón Mágico de PDF -->
            <button class="btn btn-pdf" id="btn-descargar-pdf" onclick="generarPDF()">📥 Descargar Reporte PDF</button>
        </div>
    </div>

    <!-- MODAL GRÁFICAS -->
    <div id="modal-graficas">
        <div class="glass-card login-box">
            <h2 style="color: var(--rosa-neon); margin-bottom: 15px;">Panel Directivo</h2>
            <p style="color: var(--texto-secundario); margin-bottom: 25px;">Ingresa el código maestro de acceso.</p>
            <input type="password" id="pin-input-2" class="pin-input" maxlength="4" placeholder="••••">
            <button class="btn btn-rosa" onclick="verificarPIN2()">Acceder al Balance</button>
            <button class="btn btn-outline" style="margin-top:15px; padding: 12px; border-radius: 12px;" onclick="cerrarModalGraficas()">Regresar</button>
            <p id="error-pin-2" class="alert" style="color: #ff4444;">PIN denegado</p>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxDl7kLexrbdG9O65b2qjFh3anOLa1ikxEZZdT_hRkheQYYtHTVM978pXHN4pL6lM8sug/exec';
        //                 https://script.google.com/macros/s/AKfycbxDl7kLexrbdG9O65b2qjFh3anOLa1ikxEZZdT_hRkheQYYtHTVM978pXHN4pL6lM8sug/exec

        // --- SEGURIDAD ---
        function verificarPIN1() {
            if (document.getElementById('pin-input-1').value === '1234') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                if (!datosCrudos) descargarDatos(true); // Llenar menús ocultamente
            } else {
                document.getElementById('error-pin-1').style.display = 'block';
                setTimeout(() => document.getElementById('error-pin-1').style.display = 'none', 3000);
            }
        }

        function abrirModalGraficas() { document.getElementById('modal-graficas').style.display = 'flex'; }
        function cerrarModalGraficas() { 
            document.getElementById('modal-graficas').style.display = 'none';
            document.getElementById('pin-input-2').value = '';
        }

        function verificarPIN2() {
            if (document.getElementById('pin-input-2').value === '4321') {
                cerrarModalGraficas();
                document.getElementById('seccion-graficas').style.display = 'block';
                document.getElementById('seccion-graficas').scrollIntoView({ behavior: 'smooth' });
                if (!datosCrudos) descargarDatos();
            } else {
                document.getElementById('error-pin-2').style.display = 'block';
                setTimeout(() => document.getElementById('error-pin-2').style.display = 'none', 3000);
            }
        }

        // --- ENVIAR DATOS ---
        function calcularNeto() {
            const inicial = parseFloat(document.getElementById('fondoInicial').value) || 0;
            const final = parseFloat(document.getElementById('corteFinal').value) || 0;
            document.getElementById('ingresoNeto').value = (final - inicial).toFixed(2);
        }

        function peticionPost(datos, btnId, msgId, formId, txtOriginal) {
            const btn = document.getElementById(btnId);
            btn.innerText = 'Guardando...'; btn.disabled = true;

            fetch(scriptURL, {
                method: 'POST', mode: 'no-cors',
                body: JSON.stringify(datos),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(() => {
                document.getElementById(msgId).style.display = 'block';
                document.getElementById(formId).reset();
                setTimeout(() => document.getElementById(msgId).style.display = 'none', 3000);
                if(datosCrudos) descargarDatos(true); 
            })
            .catch(err => alert('Error: ' + err.message))
            .finally(() => { btn.innerText = txtOriginal; btn.disabled = false; });
        }

        function enviarCorte(e) {
            e.preventDefault();
            peticionPost({
                tipo: "corte", fondoInicial: document.getElementById('fondoInicial').value,
                corteFinal: document.getElementById('corteFinal').value,
                ingresoNeto: document.getElementById('ingresoNeto').value,
                responsable: document.getElementById('respCorte').value 
            }, 'btnCorte', 'msgCorte', 'formCorte', 'Guardar Corte');
        }

        function enviarEgreso(e) {
            e.preventDefault();
            peticionPost({
                tipo: "egreso", categoria: document.getElementById('categoriaEgreso').value,
                monto: document.getElementById('montoEgreso').value,
                descripcion: document.getElementById('descEgreso').value,
                responsable: document.getElementById('respEgreso').value 
            }, 'btnEgreso', 'msgEgreso', 'formEgreso', 'Registrar Egreso');
        }

        // --- LECTURA DE GOOGLE Y GRAFICAS ---
        let graficaFinanciera;
        let datosCrudos = null; 
        let filtroActualStr = "Últimos 7 días"; // Para el PDF

        function descargarDatos(silencioso = false) {
            if(!silencioso) {
                document.getElementById('loading-datos').style.display = 'block';
                document.getElementById('controles-grafica').style.display = 'none';
                document.querySelector('.chart-container').style.display = 'none';
            }
            const script = document.createElement('script');
            script.src = scriptURL + "?callback=procesarJSONP";
            script.onerror = () => { if(!silencioso) document.getElementById('loading-datos').innerText = "Fallo de red."; };
            document.body.appendChild(script);
            script.onload = () => script.remove();
        }

        window.procesarJSONP = function(data) {
            if(data.estatus === "Error") return;
            datosCrudos = data;
            
            // Llenar listas dinámicas
            if (data.personal && data.personal.length > 0) {
                let opciones = '<option value="" disabled selected>Selecciona al responsable</option>';
                data.personal.forEach(nombre => opciones += `<option value="${nombre}">${nombre}</option>`);
                document.getElementById('respCorte').innerHTML = opciones;
                document.getElementById('respEgreso').innerHTML = opciones;
            }

            document.getElementById('loading-datos').style.display = 'none';
            document.getElementById('controles-grafica').style.display = 'flex';
            document.querySelector('.chart-container').style.display = 'block';
            inicializarGraficaVacia();
            procesarYDibujar('semanal');
        };

        function inicializarGraficaVacia() {
            if (graficaFinanciera) graficaFinanciera.destroy();
            const ctx = document.getElementById('miGrafica').getContext('2d');
            Chart.defaults.color = '#e0e0e0';
            Chart.defaults.font.family = "'Glacial Indifference', sans-serif";

            graficaFinanciera = new Chart(ctx, {
                type: 'bar',
                data: { labels: [], datasets: [
                    { label: 'Ingresos ($)', data: [], backgroundColor: '#FF66C4', borderRadius: 6, barPercentage: 0.7 },
                    { label: 'Egresos ($)', data: [], backgroundColor: '#C19A51', borderRadius: 6, barPercentage: 0.7 }
                ]},
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { position: 'top', labels: { font: { size: 14 } } }
                    },
                    scales: {
                        y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, beginAtZero: true },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function procesarYDibujar(filtro) {
            if (!datosCrudos) return;

            document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('activo'));
            document.getElementById('btn-' + filtro).classList.add('activo');

            const hoy = new Date(); hoy.setHours(0,0,0,0);
            let fechaLimite = new Date();
            
            if (filtro === 'diario') { fechaLimite.setDate(hoy.getDate()); filtroActualStr = "Hoy"; }
            else if (filtro === 'semanal') { fechaLimite.setDate(hoy.getDate() - 6); filtroActualStr = "Últimos 7 días"; }
            else if (filtro === 'mensual') { fechaLimite.setDate(1); filtroActualStr = "Mes Actual"; }

            let reporteAgrupado = {};

            const agruparFila = (filaFechaStr, montoStr, tipo) => {
                let fechaRegistro = new Date(filaFechaStr); fechaRegistro.setHours(0,0,0,0);
                if (fechaRegistro >= fechaLimite) {
                    let monto = parseFloat(montoStr) || 0;
                    let etiqueta = fechaRegistro.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit' });
                    if (!reporteAgrupado[etiqueta]) reporteAgrupado[etiqueta] = { ingresos: 0, egresos: 0, ms: fechaRegistro.getTime() };
                    reporteAgrupado[etiqueta][tipo] += monto;
                }
            };

            if (datosCrudos.cortes) datosCrudos.cortes.forEach(fila => agruparFila(fila[0], fila[3], 'ingresos'));
            if (datosCrudos.egresos) datosCrudos.egresos.forEach(fila => agruparFila(fila[0], fila[2], 'egresos'));

            let etiquetasOrdenadas = Object.keys(reporteAgrupado).sort((a, b) => reporteAgrupado[a].ms - reporteAgrupado[b].ms);
            
            if (filtro === 'diario' && etiquetasOrdenadas.length === 0) {
                let etiquetaHoy = hoy.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit' });
                etiquetasOrdenadas = [etiquetaHoy];
                reporteAgrupado[etiquetaHoy] = { ingresos: 0, egresos: 0 };
            }

            graficaFinanciera.data.labels = etiquetasOrdenadas;
            graficaFinanciera.data.datasets[0].data = etiquetasOrdenadas.map(e => reporteAgrupado[e].ingresos);
            graficaFinanciera.data.datasets[1].data = etiquetasOrdenadas.map(e => reporteAgrupado[e].egresos);
            graficaFinanciera.update();
        }

       // --- EXPORTAR A PDF (MÉTODO BLINDADO DUPIXELCODE) ---
        function generarPDF() {
            const elemento = document.getElementById('reporte-exportar');
            const boton = document.getElementById('btn-descargar-pdf');
            const canvas = document.getElementById('miGrafica');
            
            // 1. Ocultar botones para un reporte limpio
            document.getElementById('controles-grafica').style.display = 'none';
            boton.innerHTML = 'Generando archivo... ⏳'; 
            boton.disabled = true;

            // 2. TRUCO INFALIBLE: Convertir la gráfica a imagen estática
            // Esto evita que el PDF colapse con las animaciones y transparencias
            const imgCanvas = document.createElement('img');
            imgCanvas.src = canvas.toDataURL('image/png', 1.0);
            imgCanvas.style.width = '100%';
            imgCanvas.style.maxHeight = '400px'; 
            imgCanvas.style.objectFit = 'contain';
            
            // Escondemos el canvas real interactivo y mostramos la foto
            canvas.style.display = 'none';
            canvas.parentNode.appendChild(imgCanvas);

            // 3. Forzar el diseño de DUPIXELCODE para el PDF
            const estiloOriginal = elemento.getAttribute('style') || '';
            elemento.style.backgroundColor = '#0A0A0A'; // Fondo oscuro premium
            elemento.style.color = '#FFFFFF';           // Texto blanco puro
            elemento.style.padding = '30px';
            elemento.style.borderRadius = '0px';        // Quitar bordes redondos para el PDF

            const opt = {
                margin:       10,
                filename:     `Reporte_TheCrown_${filtroActualStr.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 1 }, 
                html2canvas:  { 
                    scale: 2, 
                    backgroundColor: '#0A0A0A',
                    useCORS: true
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            // 4. Tomar la foto y guardar el PDF
            html2pdf().set(opt).from(elemento).save().then(() => {
                
                // 5. Restaurar la página a su estado original interactivo
                canvas.style.display = 'block';
                imgCanvas.remove();
                
                elemento.setAttribute('style', estiloOriginal); // Devolver transparencias
                document.getElementById('controles-grafica').style.display = 'flex';
                
                boton.innerHTML = '📥 Descargar Reporte PDF'; 
                boton.disabled = false;
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financiero</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --fondo: #0A0A0A;
            --superficie: #111111;
            --borde: rgba(255, 255, 255, 0.1);
            --acento: #00D2FF;
            --texto-principal: #FFFFFF;
            --texto-secundario: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--fondo); color: var(--texto-principal);
            font-family: 'Lato', sans-serif; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; padding: 20px;
        }

        h1, h2, h3 { font-family: 'Poppins', sans-serif; text-align: left; }

        .tech-card {
            background: var(--superficie); border: 1px solid var(--borde);
            border-radius: 12px; padding: 30px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .login-container { display: flex; justify-content: center; align-items: center; min-height: 80vh; width: 100%; }
        .login-box { max-width: 400px; text-align: left; }
        .login-box h1 { color: var(--acento); margin-bottom: 5px; font-size: 2rem; }
        
        .pin-input {
            background: rgba(255,255,255,0.03); border: 1px solid var(--borde); color: white;
            font-size: 1.5rem; text-align: center; letter-spacing: 15px; padding: 15px;
            border-radius: 8px; width: 100%; margin-bottom: 20px; font-family: 'Poppins', sans-serif;
        }
        .pin-input:focus { outline: none; border-color: var(--acento); }

        #main-content { display: none; width: 100%; max-width: 1200px; }
        .forms-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 30px; }
        @media (min-width: 768px) { .forms-grid { grid-template-columns: 1fr 1fr; } }

        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-family: 'Poppins'; font-size: 0.85rem; color: var(--texto-secundario); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        input, select {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--borde);
            border-radius: 8px; padding: 12px; color: white; font-family: 'Lato', sans-serif; font-size: 1rem;
        }
        input:focus, select:focus { outline: none; border-color: var(--acento); }
        select option { background-color: var(--fondo); color: #FFFFFF; }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            font-family: 'Poppins'; font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-acento { background: var(--acento); color: #000; }
        .btn-acento:hover { box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); transform: translateY(-1px); }
        .btn-outline { background: transparent; color: var(--texto-principal); border: 1px solid var(--borde); margin-bottom: 20px; }
        .btn-outline:hover { border-color: var(--acento); color: var(--acento); }
        .btn-filtro { padding: 6px 12px; font-size: 0.85rem; margin-top: 0; width: auto; opacity: 0.5; border: 1px solid var(--borde); background: transparent; color: white;}
        .btn-filtro.activo { opacity: 1; border-color: var(--acento); color: var(--acento); }

        .alert { margin-top: 15px; font-size: 0.9rem; display: none; text-align: left; }

        #modal-graficas {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10,10,10,0.9); backdrop-filter: blur(5px);
            justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        #seccion-graficas { display: none; margin-top: 20px; }
        .chart-container { position: relative; height: 300px; width: 100%; margin-top: 20px; }
        @media (min-width: 768px) { .chart-container { height: 400px; } }
        #loading-datos { color: var(--acento); margin-top: 20px; font-weight: bold; display: none; font-family: 'Poppins'; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-container">
        <div class="tech-card login-box">
            <h1>ACCESO</h1>
            <p style="color: var(--texto-secundario); margin-bottom: 30px;">Control Financiero</p>
            <input type="password" id="pin-input-1" class="pin-input" maxlength="4" placeholder="••••">
            <button class="btn btn-acento" onclick="verificarPIN1()">Desbloquear</button>
            <p id="error-pin-1" class="alert" style="color: #ff4444;">PIN incorrecto</p>
        </div>
    </div>

    <div id="main-content">
        <button class="btn btn-outline" onclick="abrirModalGraficas()">Ver Balance y Gráficas</button>

        <div class="forms-grid">
            <div class="tech-card">
                <h2 style="color: var(--acento); margin-bottom: 25px;">Corte Diario</h2>
                <form id="formCorte" onsubmit="enviarCorte(event)">
                    <div class="form-group">
                        <label>Fondo Inicial ($)</label>
                        <input type="number" id="fondoInicial" required oninput="calcularNeto()">
                    </div>
                    <div class="form-group">
                        <label>Corte Final ($)</label>
                        <input type="number" id="corteFinal" required oninput="calcularNeto()">
                    </div>
                    <div class="form-group">
                        <label>Ingreso Neto ($)</label>
                        <input type="number" id="ingresoNeto" readonly style="background: rgba(0,210,255,0.05); color: var(--acento); font-weight: bold;">
                    </div>
                    <div class="form-group">
                        <label>Responsable</label>
                        <!-- LISTA DESPLEGABLE DINÁMICA -->
                        <select id="respCorte" required>
                            <option value="" disabled selected>Cargando personal...</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-acento" id="btnCorte">Guardar Corte</button>
                    <p id="msgCorte" class="alert" style="color: var(--acento);">Operación exitosa</p>
                </form>
            </div>

            <div class="tech-card">
                <h2 style="color: var(--texto-principal); margin-bottom: 25px;">Egresos</h2>
                <form id="formEgreso" onsubmit="enviarEgreso(event)">
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="categoriaEgreso" required>
                            <option value="" disabled selected>Selecciona un rubro</option>
                            <option value="Nomina">Nómina / Maestros</option>
                            <option value="Limpieza">Limpieza</option>
                            <option value="Servicios">Servicios (Luz, Agua, Internet)</option>
                            <option value="Renta">Renta</option>
                            <option value="Otros">Otros (Especificar)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Monto ($)</label>
                        <input type="number" id="montoEgreso" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <input type="text" id="descEgreso" required placeholder="Ej. Materiales, pagos...">
                    </div>
                    <div class="form-group">
                        <label>Responsable</label>
                        <!-- LISTA DESPLEGABLE DINÁMICA -->
                        <select id="respEgreso" required>
                            <option value="" disabled selected>Cargando personal...</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-outline" id="btnEgreso">Registrar Egreso</button>
                    <p id="msgEgreso" class="alert" style="color: var(--acento);">Operación exitosa</p>
                </form>
            </div>
        </div>

        <div id="seccion-graficas" class="tech-card">
            <h2 style="margin-bottom: 5px;">Balance Financiero</h2>
            <p id="loading-datos">Sincronizando con base de datos...</p>
            
            <div style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;" id="controles-grafica">
                <button id="btn-diario" class="btn btn-filtro" onclick="procesarYDibujar('diario')">Hoy</button>
                <button id="btn-semanal" class="btn btn-filtro activo" onclick="procesarYDibujar('semanal')">7 Días</button>
                <button id="btn-mensual" class="btn btn-filtro" onclick="procesarYDibujar('mensual')">Mes</button>
            </div>
            
            <div class="chart-container">
                <canvas id="miGrafica"></canvas>
            </div>
        </div>
    </div>

    <!-- MODAL GRÁFICAS -->
    <div id="modal-graficas">
        <div class="tech-card login-box">
            <h2 style="color: var(--texto-principal); margin-bottom: 15px;">Acceso Directivo</h2>
            <p style="color: var(--texto-secundario); margin-bottom: 20px;">Autenticación requerida.</p>
            <input type="password" id="pin-input-2" class="pin-input" maxlength="4" placeholder="••••">
            <button class="btn btn-acento" onclick="verificarPIN2()">Visualizar Datos</button>
            <button class="btn btn-outline" style="margin-top:10px;" onclick="cerrarModalGraficas()">Cancelar</button>
            <p id="error-pin-2" class="alert" style="color: #ff4444;">PIN incorrecto</p>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxDl7kLexrbdG9O65b2qjFh3anOLa1ikxEZZdT_hRkheQYYtHTVM978pXHN4pL6lM8sug/exec';

        // --- SEGURIDAD ---
        function verificarPIN1() {
            if (document.getElementById('pin-input-1').value === '1234') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                
                // INICIA DESCARGA SILENCIOSA PARA LLENAR LOS MENÚS
                if (!datosCrudos) descargarDatos(true);
            } else {
                document.getElementById('error-pin-1').style.display = 'block';
                setTimeout(() => document.getElementById('error-pin-1').style.display = 'none', 3000);
            }
        }

        function abrirModalGraficas() { document.getElementById('modal-graficas').style.display = 'flex'; }
        function cerrarModalGraficas() { 
            document.getElementById('modal-graficas').style.display = 'none';
            document.getElementById('pin-input-2').value = '';
        }

        function verificarPIN2() {
            if (document.getElementById('pin-input-2').value === '4321') {
                cerrarModalGraficas();
                document.getElementById('seccion-graficas').style.display = 'block';
                document.getElementById('seccion-graficas').scrollIntoView({ behavior: 'smooth' });
                if (!datosCrudos) descargarDatos();
            } else {
                document.getElementById('error-pin-2').style.display = 'block';
                setTimeout(() => document.getElementById('error-pin-2').style.display = 'none', 3000);
            }
        }

        // --- ENVIAR DATOS ---
        function calcularNeto() {
            const inicial = parseFloat(document.getElementById('fondoInicial').value) || 0;
            const final = parseFloat(document.getElementById('corteFinal').value) || 0;
            document.getElementById('ingresoNeto').value = (final - inicial).toFixed(2);
        }

        function peticionPost(datos, btnId, msgId, formId, txtOriginal) {
            const btn = document.getElementById(btnId);
            btn.innerText = 'Procesando...'; btn.disabled = true;

            fetch(scriptURL, {
                method: 'POST', 
                mode: 'no-cors',
                body: JSON.stringify(datos),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(() => {
                document.getElementById(msgId).style.display = 'block';
                document.getElementById(formId).reset();
                setTimeout(() => document.getElementById(msgId).style.display = 'none', 3000);
                if(datosCrudos) descargarDatos(true); 
            })
            .catch(err => alert('Error local: ' + err.message))
            .finally(() => { btn.innerText = txtOriginal; btn.disabled = false; });
        }

        function enviarCorte(e) {
            e.preventDefault();
            peticionPost({
                tipo: "corte", fondoInicial: document.getElementById('fondoInicial').value,
                corteFinal: document.getElementById('corteFinal').value,
                ingresoNeto: document.getElementById('ingresoNeto').value,
                responsable: document.getElementById('respCorte').value
            }, 'btnCorte', 'msgCorte', 'formCorte', 'Guardar Corte');
        }

        function enviarEgreso(e) {
            e.preventDefault();
            peticionPost({
                tipo: "egreso", categoria: document.getElementById('categoriaEgreso').value,
                monto: document.getElementById('montoEgreso').value,
                descripcion: document.getElementById('descEgreso').value,
                responsable: document.getElementById('respEgreso').value
            }, 'btnEgreso', 'msgEgreso', 'formEgreso', 'Registrar Egreso');
        }

        // --- LECTURA JSONP Y LLENADO DINÁMICO ---
        let graficaFinanciera;
        let datosCrudos = null; 

        function descargarDatos(silencioso = false) {
            if(!silencioso) {
                document.getElementById('loading-datos').style.display = 'block';
                document.getElementById('controles-grafica').style.display = 'none';
            }
            
            const script = document.createElement('script');
            script.src = scriptURL + "?callback=procesarJSONP";
            script.onerror = () => { if(!silencioso) document.getElementById('loading-datos').innerText = "Error de red."; };
            
            document.body.appendChild(script);
            script.onload = () => script.remove();
        }

        window.procesarJSONP = function(data) {
            if(data.estatus === "Error") {
                document.getElementById('loading-datos').innerText = "Error: " + data.mensaje;
                return;
            }
            datosCrudos = data;
            
            // LLENADO AUTOMÁTICO DE LOS MENÚS DESPLEGABLES
            if (data.personal && data.personal.length > 0) {
                let opciones = '<option value="" disabled selected>Selecciona al responsable</option>';
                data.personal.forEach(nombre => {
                    opciones += `<option value="${nombre}">${nombre}</option>`;
                });
                document.getElementById('respCorte').innerHTML = opciones;
                document.getElementById('respEgreso').innerHTML = opciones;
            } else {
                let vacio = '<option value="" disabled selected>No hay personal registrado</option>';
                document.getElementById('respCorte').innerHTML = vacio;
                document.getElementById('respEgreso').innerHTML = vacio;
            }

            document.getElementById('loading-datos').style.display = 'none';
            document.getElementById('controles-grafica').style.display = 'flex';
            inicializarGraficaVacia();
            procesarYDibujar('semanal');
        };

        function inicializarGraficaVacia() {
            if (graficaFinanciera) graficaFinanciera.destroy();
            const ctx = document.getElementById('miGrafica').getContext('2d');
            Chart.defaults.color = '#94A3B8';
            Chart.defaults.font.family = "'Lato', sans-serif";

            graficaFinanciera = new Chart(ctx, {
                type: 'bar',
                data: { labels: [], datasets: [
                    { label: 'Ingresos Netos', data: [], backgroundColor: '#00D2FF', borderRadius: 4 },
                    { label: 'Egresos', data: [], backgroundColor: '#334155', borderRadius: 4 }
                ]},
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: {
                        y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, beginAtZero: true },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function procesarYDibujar(filtro) {
            if (!datosCrudos) return;

            document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('activo'));
            document.getElementById('btn-' + filtro).classList.add('activo');

            const hoy = new Date(); hoy.setHours(0,0,0,0);
            let fechaLimite = new Date();
            
            if (filtro === 'diario') fechaLimite.setDate(hoy.getDate()); 
            else if (filtro === 'semanal') fechaLimite.setDate(hoy.getDate() - 6); 
            else if (filtro === 'mensual') fechaLimite.setDate(1); 

            let reporteAgrupado = {};

            const agruparFila = (filaFechaStr, montoStr, tipo) => {
                let fechaRegistro = new Date(filaFechaStr);
                fechaRegistro.setHours(0,0,0,0);
                
                if (fechaRegistro >= fechaLimite) {
                    let monto = parseFloat(montoStr) || 0;
                    let etiqueta = fechaRegistro.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit' });
                    if (!reporteAgrupado[etiqueta]) {
                        reporteAgrupado[etiqueta] = { ingresos: 0, egresos: 0, ms: fechaRegistro.getTime() };
                    }
                    reporteAgrupado[etiqueta][tipo] += monto;
                }
            };

            if (datosCrudos.cortes) datosCrudos.cortes.forEach(fila => agruparFila(fila[0], fila[3], 'ingresos'));
            if (datosCrudos.egresos) datosCrudos.egresos.forEach(fila => agruparFila(fila[0], fila[2], 'egresos'));

            let etiquetasOrdenadas = Object.keys(reporteAgrupado).sort((a, b) => reporteAgrupado[a].ms - reporteAgrupado[b].ms);
            
            if (filtro === 'diario' && etiquetasOrdenadas.length === 0) {
                let etiquetaHoy = hoy.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit' });
                etiquetasOrdenadas = [etiquetaHoy];
                reporteAgrupado[etiquetaHoy] = { ingresos: 0, egresos: 0 };
            }

            graficaFinanciera.data.labels = etiquetasOrdenadas;
            graficaFinanciera.data.datasets[0].data = etiquetasOrdenadas.map(e => reporteAgrupado[e].ingresos);
            graficaFinanciera.data.datasets[1].data = etiquetasOrdenadas.map(e => reporteAgrupado[e].egresos);
            graficaFinanciera.update();
        }
    </script>
</body>
</html>

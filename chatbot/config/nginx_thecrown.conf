# ==============================================================================
# THE CROWN DANCE STUDIO - CONFIGURACIÓN RECOMENDADA DE NGINX REVERSE PROXY
# ==============================================================================
# Protege el endpoint del chatbot, aplica rate limiting en borde, cabeceras
# de seguridad y reenvía tráfico al servidor n8n / proxy interno.
# ==============================================================================

# 1. Definición de zonas de Rate Limiting en Nginx
limit_req_zone $binary_remote_addr zone=crown_chat_ip:10m rate=15r/m;
limit_conn_zone $binary_remote_addr zone=crown_conn_limit:10m;

server {
    listen 80;
    server_name thecrowndancestudio.com www.thecrowndancestudio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name thecrowndancestudio.com www.thecrowndancestudio.com;

    # Certificados SSL / TLS (Let's Encrypt o Cloudflare Origin)
    ssl_certificate /etc/letsencrypt/live/thecrowndancestudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thecrowndancestudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cabeceras globales de endurecimiento de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Raíz del sitio estático
    root /var/www/thecrowndancestudio;
    index index.html;

    # Archivos estáticos y caché
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|webp|svg|mp4|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ==========================================================================
    # ENDPOINT SEGURO DEL CHATBOT: /api/chat
    # ==========================================================================
    location /api/chat {
        # Restricción de métodos permitidos
        limit_except POST OPTIONS {
            deny all;
        }

        # Aplicación de Rate Limiting estricto por IP
        limit_req zone=crown_chat_ip burst=5 nodelay;
        limit_conn crown_conn_limit 10;

        # Límite estricto de tamaño de payload (máximo 16 KB)
        client_max_body_size 16k;
        client_body_buffer_size 16k;

        # Timeouts seguros para evitar peticiones colgadas
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 12s;

        # Reenvío al Proxy Autónomo Node.js/Python (ejecutándose en localhost:3000)
        proxy_pass http://127.0.0.1:3000/api/chat;

        # Cabeceras hacia el proxy backend
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================================
    # WEBHOOK PRIVADO DE N8N (Acceso solo local o por red interna)
    # NUNCA exponer /webhook/crown-chat-v1 abiertamente sin auth
    # ==========================================================================
    location /webhook/crown-chat-v1 {
        # Bloquear acceso directo desde IPs externas: solo permitir localhost
        allow 127.0.0.1;
        allow 172.16.0.0/12; # Docker network
        deny all;

        proxy_pass http://127.0.0.1:5678/webhook/crown-chat-v1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

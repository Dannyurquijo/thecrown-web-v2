<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Glowing Ambient Aura -->
  <defs>
    <radialGradient id="ballerinaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF66C4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#C19A51" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldCrownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A5"/>
      <stop offset="50%" stop-color="#C19A51"/>
      <stop offset="100%" stop-color="#8C6621"/>
    </linearGradient>
    <linearGradient id="tutuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF94DC"/>
      <stop offset="50%" stop-color="#FF66C4"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F7"/>
    </linearGradient>
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF66C4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Aura Circle Background -->
  <circle cx="60" cy="60" r="54" fill="url(#ballerinaGlow)" opacity="0.45"/>

  <!-- Ballerina Silhouette & Figure Group -->
  <g filter="url(#neonFilter)">
    <!-- Golden Crown 👑 on Head -->
    <path d="M54 13 L56 18 L60 14 L64 18 L66 13 L68 20 L52 20 Z" fill="url(#goldCrownGrad)" stroke="#FFE885" stroke-width="0.8"/>
    <circle cx="54" cy="13" r="1" fill="#FFFFFF"/>
    <circle cx="60" cy="14" r="1" fill="#FFFFFF"/>
    <circle cx="66" cy="13" r="1" fill="#FFFFFF"/>

    <!-- Head and Bun -->
    <circle cx="60" cy="24" r="5" fill="url(#bodyGrad)"/>
    <circle cx="58" cy="19" r="2.5" fill="url(#bodyGrad)"/> <!-- Moño / Ballet Bun -->

    <!-- Neck & Torso / Leotard -->
    <path d="M58 29 Q60 30 62 29 L63 46 Q60 48 57 46 Z" fill="url(#bodyGrad)"/>

    <!-- Left Arm Raised High (Fifth Position) -->
    <path d="M58 31 C52 25, 48 18, 54 12 C56 15, 54 22, 59 30" stroke="url(#bodyGrad)" stroke-width="2.6" stroke-linecap="round" fill="none"/>

    <!-- Right Arm Curved Elegantly Outward -->
    <path d="M62 31 C69 28, 77 34, 76 43 C74 41, 70 34, 61 33" stroke="url(#bodyGrad)" stroke-width="2.6" stroke-linecap="round" fill="none"/>

    <!-- Flared Ballet Tutu -->
    <path d="M54 46 C40 47, 33 54, 42 58 C51 61, 69 61, 78 58 C87 54, 80 47, 66 46 Z" fill="url(#tutuGrad)"/>
    <path d="M48 48 C38 52, 45 56, 60 56 C75 56, 82 52, 72 48" stroke="#FFEAF7" stroke-width="1.2" fill="none" opacity="0.8"/>

    <!-- Supporting Leg en Pointe (Puntas) -->
    <path d="M58 56 L59 98 L60 106 L58 106" stroke="url(#bodyGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Point shoe box (Zapatilla de puntas) -->
    <path d="M58 104 L60 104 L60.5 108 L57.5 108 Z" fill="url(#tutuGrad)"/>
    <!-- Ribbons on ankle -->
    <line x1="57" y1="99" x2="61" y2="102" stroke="url(#tutuGrad)" stroke-width="0.8"/>
    <line x1="61" y1="99" x2="57" y2="102" stroke="url(#tutuGrad)" stroke-width="0.8"/>

    <!-- Extended Gesture Leg (Attitude Derrière / Arabesque) -->
    <path d="M62 56 C67 66, 75 75, 76 83 C76 85, 74 88, 70 87" stroke="url(#bodyGrad)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <circle cx="70" cy="87" r="1.5" fill="url(#tutuGrad)"/> <!-- Zapatilla alzada -->

    <!-- Magic Sparkles ✨ -->
    <path d="M86 26 L88 30 L92 32 L88 34 L86 38 L84 34 L80 32 L84 30 Z" fill="#FFE082" opacity="0.9"/>
    <path d="M30 38 L31.5 41 L34.5 42.5 L31.5 44 L30 47 L28.5 44 L25.5 42.5 L28.5 41 Z" fill="#FF80AB" opacity="0.8"/>
    <path d="M82 88 L83 90 L85 91 L83 92 L82 94 L81 92 L79 91 L81 90 Z" fill="#FFE082" opacity="0.85"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Agendar Clase de Prueba | The Crown Dance Studio</title>
    <meta name="description" content="Agenda tu clase de prueba en The Crown Dance Studio. Únete a nuestra comunidad de baile en Corregidora, Querétaro.">
    
    <link rel="icon" type="image/png" href="logo_corona.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/3d-effects.css">

    <style>
        .agenda-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 140px 5% 80px 5%;
        }

        .glass-card {
            background: var(--apple-surface);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--apple-border);
            border-radius: 40px;
            width: 100%;
            max-width: 580px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
            position: relative;
            transition: border-color 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(255, 102, 196, 0.35);
        }

        .glass-card h1 {
            font-family: var(--font-heading);
            font-size: clamp(2.4rem, 5vw, 3.4rem);
            font-weight: 900;
            letter-spacing: -1.5px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 30%, #a8a8a8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            text-align: left;
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-family: var(--font-heading);
            font-size: 0.88rem;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: var(--dorado);
            font-weight: 700;
            padding-left: 4px;
        }

        input, select {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--apple-border);
            border-radius: 16px;
            padding: 16px;
            color: #fff;
            font-family: var(--font-body);
            font-size: 1.05rem;
            transition: var(--transition-smooth);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--rosa-neon);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px var(--rosa-glow);
        }

        option {
            background: #000;
            color: #fff;
            font-family: var(--font-body);
        }

        optgroup {
            background: #000;
            color: var(--dorado);
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1rem;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--rosa-neon), #ff3399);
            color: white;
            border: none;
            border-radius: 22px;
            font-family: var(--font-heading);
            font-weight: 900;
            font-size: 1.15rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 25px var(--rosa-glow);
            transition: var(--transition-smooth);
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px var(--rosa-glow);
        }

        @media (max-width: 600px) {
            .glass-card {
                padding: 35px 22px;
                border-radius: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="cursor-glow"></div>

    <nav class="navbar">
        <a href="index.html" class="nav-logo"><img src="logo.png" alt="The Crown Logo"></a>
        
        <div class="hamburger">
            <i class="fas fa-bars"></i>
        </div>

        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="galeria.html">Galería</a>
            <a href="index.html#horarios">Horarios</a>
        </div>
    </nav>

    <div class="agenda-container">
        <div class="glass-card">
            <h1>Agenda tu Clase</h1>
            <p style="color: var(--text-secondary); margin-bottom: 35px; font-size: 1.15rem;">
                Comienza tu formación en The Crown Studio 👑
            </p>

            <form id="agendaForm">
                <div class="form-group">
                    <label>Nombre del Alumno</label>
                    <input type="text" id="nombreAlumno" placeholder="Nombre completo" required>
                </div>

                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>Edad</label>
                        <input type="number" id="edadAlumno" placeholder="Ej. 14" min="3" max="99" required>
                    </div>
                    <div>
                        <label>WhatsApp</label>
                        <input type="tel" id="telefonoAlumno" placeholder="10 dígitos" pattern="[0-9]{10}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Disciplina de interés</label>
                    <select id="selectDisciplina" required>
                        <option value="" disabled selected>Selecciona una clase</option>
                        
                        <optgroup label="INFANTIL (KIDS)">
                            <option value="baby_ballet">Baby Ballet</option>
                            <option value="ballet_kids">Ballet Kids</option>
                            <option value="hip_hop_kids">Hip Hop Kids</option>
                            <option value="jazz_kids">Jazz Kids</option>
                            <option value="circo_kids">Circo Kids</option>
                            <option value="danza_aerea_kids">Danza Aérea Kids</option>
                        </optgroup>

                        <optgroup label="URBANO">
                            <option value="urbano">Urbano (Multinivel)</option>
                            <option value="hip_hop_1">Hip Hop 1</option>
                            <option value="hip_hop_2">Hip Hop 2</option>
                            <option value="hip_hop_multinivel">Hip Hop Multinivel</option>
                            <option value="reggaeton">Reggaetón</option>
                            <option value="kpop">K-Pop</option>
                        </optgroup>

                        <optgroup label="CONTEMPORÁNEO">
                            <option value="contemporaneo_1">Contemporáneo 1</option>
                            <option value="contemporaneo_2">Contemporáneo 2</option>
                            <option value="contemporaneo_teens">Contemporáneo Teens</option>
                            <option value="contemporaneo_multinivel">Contemporáneo Multinivel</option>
                            <option value="contemporaneo_piso">Contemporáneo Piso</option>
                        </optgroup>

                        <optgroup label="TÉCNICA (BALLET / JAZZ)">
                            <option value="ballet_1">Ballet 1</option>
                            <option value="ballet_2">Ballet 2</option>
                            <option value="puntas">Puntas</option>
                            <option value="jazz_1">Jazz 1</option>
                            <option value="jazz_2">Jazz 2</option>
                        </optgroup>

                        <optgroup label="ESPECIALIDADES Y ACONDICIONAMIENTO">
                            <option value="heels">Heels Choreography</option>
                            <option value="danza_aerea_multinivel">Danza Aérea Multinivel</option>
                            <option value="acrobacia">Trucos Acrobáticos / Acrobacia</option>
                            <option value="flexibilidad">Flexibilidad y Balances</option>
                            <option value="acondicionamiento">Acondicionamiento para Bailarines</option>
                        </optgroup>
                    </select>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fab fa-whatsapp"></i> Agendar por WhatsApp
                </button>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 The Crown Dance Studio</p>
    </footer>

    <script>
        // Spotlight cursor glow
        window.addEventListener('mousemove', (e) => {
            document.documentElement.style.setProperty('--mouse-x', `${e.clientX}px`);
            document.documentElement.style.setProperty('--mouse-y', `${e.clientY}px`);
        }, { passive: true });

        // Auto-selección de disciplina desde parámetros de URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const disc = urlParams.get('disciplina');
            if (disc) {
                const select = document.getElementById('selectDisciplina');
                if (select) {
                    for (let i = 0; i < select.options.length; i++) {
                        if (select.options[i].value === disc) {
                            select.selectedIndex = i;
                            break;
                        }
                    }
                }
            }
        });

        // Menú hamburguesa
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');
        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        }

        // Envío directo a WhatsApp
        document.getElementById('agendaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombreAlumno').value;
            const edad = document.getElementById('edadAlumno').value;
            const telefono = document.getElementById('telefonoAlumno').value;
            const select = document.getElementById('selectDisciplina');
            const disciplinaTexto = select.options[select.selectedIndex].text;

            const textoWhatsApp = `¡Hola The Crown Studio! 👑%0A%0AMi nombre es *${nombre}* (${edad} años).%0A%0A*Quiero agendar mi clase de prueba en:* ${disciplinaTexto}%0A*Mi WhatsApp:* ${telefono}%0A%0A¡Espero su confirmación! ✨`;
            
            const url = `https://wa.me/524423479755?text=${textoWhatsApp}`;
            window.open(url, '_blank');
            this.reset();
        });
    </script>
</body>
</html>

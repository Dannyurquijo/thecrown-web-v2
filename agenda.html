<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Agendar Clase | The Crown Dance Studio</title>
    <meta name="description" content="Agenda tu clase de prueba en The Crown Dance Studio. Únete a nuestra comunidad de baile en Corregidora, Querétaro.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILO BASE iOS 27 --- */
        :root {
            --apple-dark: #000000;
            --apple-surface: rgba(255, 255, 255, 0.05);
            --apple-border: rgba(255, 255, 255, 0.1);
            --rosa-neon: #FF66C4;
            --rosa-glow: rgba(255, 102, 196, 0.3);
            --dorado: #C19A51;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--apple-dark);
            color: var(--text-primary);
            font-family: 'Glacial Indifference', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* AMBIENT GLOW */
        body::before {
            content: ''; position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, var(--rosa-glow) 0%, transparent 70%);
            z-index: -1; filter: blur(80px); pointer-events: none;
        }

        /* --- NAV FLOTANTE --- */
        .navbar {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 1200px;
            background: rgba(15, 15, 15, 0.6); backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid var(--apple-border); border-radius: 40px;
            padding: 10px 25px; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }
        .nav-logo img { height: 35px; width: auto; }
        .nav-links a {
            color: var(--text-primary); text-decoration: none; margin-left: 20px;
            font-size: 0.85rem; text-transform: uppercase; font-weight: 700; font-family: 'League Spartan';
        }
        .nav-links a:hover { color: var(--rosa-neon); }

        /* --- CONTENEDOR DE AGENDA --- */
        .agenda-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 140px 5% 80px 5%;
        }

        .glass-card {
            background: var(--apple-surface);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--apple-border);
            border-radius: 40px;
            width: 100%;
            max-width: 550px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        h1 {
            font-family: 'League Spartan', sans-serif;
            font-size: 2.5rem; font-weight: 900; letter-spacing: -1px;
            margin-bottom: 10px; background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        p.subtitle { color: var(--text-secondary); margin-bottom: 35px; font-size: 1rem; }

        /* --- FORMULARIO iOS --- */
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-family: 'League Spartan'; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 8px; color: var(--dorado); font-weight: 700; padding-left: 5px;}
        
        input, select, textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--apple-border);
            border-radius: 15px;
            padding: 15px;
            color: #fff;
            font-family: 'Glacial Indifference';
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--rosa-neon);
            background: rgba(255,255,255,0.1);
        }

        /* --- LA BAILARINA QUE TE MIRA (SVG Dinámico) --- */
        .dancer-watcher {
            width: 120px;
            margin: 10px auto -10px auto;
            position: relative;
            z-index: 10;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--rosa-neon), #ff3399);
            color: white;
            border: none;
            border-radius: 20px;
            font-family: 'League Spartan';
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 25px var(--rosa-glow);
            transition: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .submit-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px var(--rosa-glow);
        }

        footer { padding: 30px; text-align: center; color: var(--text-secondary); font-size: 0.8rem; }

        @media (max-width: 600px) {
            .glass-card { padding: 30px 20px; border-radius: 30px; }
            .navbar { padding: 10px 15px; }
            .nav-links { display: none; } /* En agenda simplificamos para móvil */
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo"><img src="logo.png" alt="The Crown Logo"></a>
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="galeria.html">Galería</a>
            <a href="index.html#horarios">Horarios</a>
        </div>
    </nav>

    <div class="agenda-container">
        <div class="glass-card">
            <h1>Agenda tu Clase</h1>
            <p class="subtitle">Comienza tu formación en The Crown Studio</p>

            <form id="agendaForm">
                <div class="form-group">
                    <label>Nombre del Alumno</label>
                    <input type="text" placeholder="Nombre completo" required>
                </div>

                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>Edad</label>
                        <input type="number" placeholder="Ej. 12" required>
                    </div>
                    <div>
                        <label>WhatsApp</label>
                        <input type="tel" placeholder="10 dígitos" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Disciplina de interés</label>
                    <select required>
                        <option value="" disabled selected>Selecciona una clase</option>
                        <option value="urbano">Urbano (Hip Hop / Reggaetón)</option>
                        <option value="tecnica">Técnica (Ballet / Jazz)</option>
                        <option value="kids">Kids (Baby Ballet / Jazz Kids)</option>
                        <option value="complementario">Aéreo / Acrobacia</option>
                    </select>
                </div>

                <div class="dancer-watcher">
                    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                        <path d="M60,20 C35,20 20,40 20,65 C20,90 35,110 60,110 C85,110 100,90 100,65 C100,40 85,20 60,20" fill="none" stroke="#C19A51" stroke-width="2"/>
                        <circle cx="60" cy="15" r="12" fill="#333" />
                        <circle cx="42" cy="65" r="10" fill="white" />
                        <circle cx="78" cy="65" r="10" fill="white" />
                        <g id="pupilas">
                            <circle id="pupila-izq" cx="42" cy="65" r="5" fill="black" />
                            <circle id="pupila-der" cx="78" cy="65" r="5" fill="black" />
                        </g>
                        <path d="M35,58 Q42,53 49,58" fill="none" stroke="#C19A51" stroke-width="1.5" />
                        <path d="M71,58 Q78,53 85,58" fill="none" stroke="#C19A51" stroke-width="1.5" />
                        <path d="M50,90 Q60,98 70,90" fill="none" stroke="#FF66C4" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </div>

                <button type="submit" class="submit-btn">Enviar Solicitud</button>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 The Crown Dance Studio | Corregidora, Querétaro</p>
    </footer>

    <script>
        // --- LÓGICA DE LA MIRADA SEGUIDORA ---
        const pupilaIzq = document.getElementById('pupila-izq');
        const pupilaDer = document.getElementById('pupila-der');

        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;

            moverPupila(pupilaIzq, x, y, 42, 65);
            moverPupila(pupilaDer, x, y, 78, 65);
        });

        function moverPupila(pupila, mouseX, mouseY, centerX, centerY) {
            // Obtenemos posición del ojo en la pantalla
            const rect = pupila.getBoundingClientRect();
            const ojoX = rect.left + rect.width / 2;
            const ojoY = rect.top + rect.height / 2;

            // Calculamos ángulo entre ojo y mouse
            const angulo = Math.atan2(mouseY - ojoY, mouseX - ojoX);
            
            // Limitamos el movimiento de la pupila dentro del ojo (radio de 4px)
            const distanciaMax = 4;
            const moveX = Math.cos(angulo) * distanciaMax;
            const moveY = Math.sin(angulo) * distanciaMax;

            // Aplicamos la transformación
            pupila.setAttribute('transform', `translate(${moveX}, ${moveY})`);
        }

        // Lógica de Envío (Simulación)
        document.getElementById('agendaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('¡Solicitud recibida! La bailarina te da las gracias por agendar. ✨');
            this.reset();
        });
    </script>
</body>
</html>

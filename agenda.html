<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Agendar Clase | The Crown Dance Studio</title>
    <meta name="description" content="Agenda tu clase de prueba en The Crown Dance Studio. Únete a nuestra comunidad de baile en Corregidora, Querétaro.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILO BASE iOS 27 --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        :root {
            --apple-dark: #000000;
            --apple-surface: rgba(28, 28, 30, 0.4);
            --apple-border: rgba(255, 255, 255, 0.08);
            --rosa-neon: #FF66C4;
            --rosa-glow: rgba(255, 102, 196, 0.3);
            --dorado: #C19A51;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
        }

        body {
            background-color: var(--apple-dark);
            color: var(--text-primary);
            font-family: 'Glacial Indifference', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* AMBIENT GLOW */
        body::before {
            content: ''; position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, var(--rosa-glow) 0%, transparent 70%);
            z-index: -1; filter: blur(80px); pointer-events: none;
        }
        body::after {
            content: ''; position: fixed; bottom: -20%; right: -10%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(193, 154, 81, 0.15) 0%, transparent 70%);
            z-index: -1; filter: blur(100px); pointer-events: none;
        }

        /* --- NAV FLOTANTE --- */
        .navbar {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 1200px;
            background: rgba(15, 15, 15, 0.6); backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid var(--apple-border); border-radius: 40px;
            padding: 10px 25px; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-logo img { height: 40px; width: auto; transition: 0.3s; }
        .nav-links a {
            color: var(--text-primary); text-decoration: none; margin-left: 20px;
            font-size: 0.85rem; text-transform: uppercase; font-weight: 700; font-family: 'League Spartan';
            transition: 0.3s;
        }
        .nav-links a:hover { color: var(--rosa-neon); }

        /* --- CONTENEDOR DE AGENDA --- */
        .agenda-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            padding: 140px 5% 80px 5%;
        }

        .glass-card {
            background: var(--apple-surface);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--apple-border);
            border-radius: 40px; width: 100%; max-width: 550px;
            padding: 50px 40px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        h1 {
            font-family: 'League Spartan', sans-serif;
            font-size: 3rem; font-weight: 900; letter-spacing: -1px;
            margin-bottom: 10px; background: linear-gradient(to bottom right, #fff, #a8a8a8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        p.subtitle { color: var(--text-secondary); margin-bottom: 35px; font-size: 1.1rem; }

        /* --- FORMULARIO --- */
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-family: 'League Spartan'; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 8px; color: var(--dorado); font-weight: 700; padding-left: 5px;}
        
        input, select {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--apple-border);
            border-radius: 15px; padding: 15px; color: #fff;
            font-family: 'Glacial Indifference'; font-size: 1rem;
            transition: 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: var(--rosa-neon); background: rgba(255,255,255,0.1); box-shadow: 0 0 15px var(--rosa-glow); }
        option { background: var(--apple-dark); color: #fff; }

        /* --- LA BAILARINA QUE TE MIRA 👀 (CORREGIDA) --- */
        .dancer-watcher {
            position: relative;
            width: 160px; /* Ajustado para mejor proporción */
            margin: 10px auto 25px auto; /* SE ELIMINÓ EL MARGEN NEGATIVO para no tapar el botón */
            z-index: 10;
        }

        .dancer-face {
            width: 100%;
            display: block;
            pointer-events: none;
            /* La imagen ahora es sólida y no causará transparencias oscuras */
        }

        /* Contenedores de los ojos invisibles para ubicar las pupilas */
        .eye-container {
            position: absolute;
            width: 22%;
            height: 18%;
            z-index: 11;
        }
        /* Coordenadas recalibradas para centrar perfectamente en la nueva imagen */
        .eye-left { top: 57%; left: 30%; }
        .eye-right { top: 57%; left: 59%; }

        .pupil {
            width: 14px;
            height: 14px;
            background-color: #3b1d0d; /* Marrón oscuro más natural y sólido */
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.05s linear;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.6); 
        }
        /* Brillo de la pupila para más vida */
        .pupil::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 4px; height: 4px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
        }

        /* --- BOTÓN DE ENVÍO --- */
        .submit-btn {
            position: relative;
            z-index: 5;
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, var(--rosa-neon), #ff3399);
            color: white; border: none; border-radius: 20px;
            font-family: 'League Spartan'; font-weight: 900; font-size: 1.1rem;
            text-transform: uppercase; cursor: pointer;
            box-shadow: 0 10px 25px var(--rosa-glow);
            transition: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .submit-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 35px var(--rosa-glow); }

        footer { padding: 30px; text-align: center; color: var(--text-secondary); font-size: 0.9rem; border-top: 1px solid var(--apple-border); }

        /* --- MÓVILES --- */
        @media (max-width: 600px) {
            .glass-card { padding: 40px 20px; border-radius: 30px; }
            .navbar { padding: 10px 15px; border-radius: 25px; width: 90%; top: 10px;}
            .nav-links { display: none; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo"><img src="logo.png" alt="The Crown Logo"></a>
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="galeria.html">Galería</a>
            <a href="index.html#horarios">Horarios</a>
        </div>
    </nav>

    <div class="agenda-container">
        <div class="glass-card">
            <h1>Agenda tu Clase</h1>
            <p class="subtitle">Comienza tu formación en The Crown Studio</p>

            <form id="agendaForm">
                <div class="form-group">
                    <label>Nombre del Alumno</label>
                    <input type="text" placeholder="Nombre completo" required>
                </div>

                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>Edad</label>
                        <input type="number" placeholder="Ej. 12" required>
                    </div>
                    <div>
                        <label>WhatsApp</label>
                        <input type="tel" placeholder="10 dígitos" pattern="[0-9]{10}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Disciplina de interés</label>
                    <select required>
                        <option value="" disabled selected>Selecciona una clase</option>
                        <option value="urbano">Urbano (Hip Hop / Reggaetón)</option>
                        <option value="tecnica">Técnica (Ballet / Jazz)</option>
                        <option value="kids">Kids (Baby Ballet / Jazz Kids)</option>
                        <option value="complementario">Aéreo / Acrobacia</option>
                    </select>
                </div>

                <div class="dancer-watcher">
                    <img src="bailarina_thecrowndancestudio.svg" class="dancer-face" alt="Bailarina The Crown">
                    
                    <div class="eye-container eye-left">
                        <div class="pupil" id="pupil-left"></div>
                    </div>
                    
                    <div class="eye-container eye-right">
                        <div class="pupil" id="pupil-right"></div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Agendar Clase</button>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 The Crown Dance Studio</p>
    </footer>

    <script>
        // --- LÓGICA DE LA MIRADA SEGUIDORA ---
        const pupilLeft = document.getElementById('pupil-left');
        const pupilRight = document.getElementById('pupil-right');

        // Escuchamos el movimiento del ratón en toda la pantalla
        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            moverPupila(pupilLeft, mouseX, mouseY);
            moverPupila(pupilRight, mouseX, mouseY);
        });

        function moverPupila(pupil, mouseX, mouseY) {
            // Obtenemos el contenedor del ojo para saber dónde está su centro en la pantalla
            const rect = pupil.parentElement.getBoundingClientRect();
            const eyeCenterX = rect.left + rect.width / 2;
            const eyeCenterY = rect.top + rect.height / 2;

            // Calculamos el ángulo hacia el ratón
            const angulo = Math.atan2(mouseY - eyeCenterY, mouseX - eyeCenterX);
            
            // Limitamos cuánto puede moverse la pupila para que no se salga del globo ocular
            const radioMaximoMovimiento = 6; 
            
            const distanciaMouse = Math.hypot(mouseX - eyeCenterX, mouseY - eyeCenterY);
            
            // Suavizamos el movimiento cuando el mouse está cerca de la cara
            const distanciaFinal = Math.min(radioMaximoMovimiento, distanciaMouse / 15);

            const moveX = Math.cos(angulo) * distanciaFinal;
            const moveY = Math.sin(angulo) * distanciaFinal;

            // Aplicamos el movimiento respetando el centrado original
            pupil.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
        }

        // Simulación de envío
        document.getElementById('agendaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('¡Solicitud recibida con éxito! Te contactaremos por WhatsApp. 👑');
            this.reset();
        });
    </script>
</body>
</html>
